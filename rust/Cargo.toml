[workspace]
resolver = "3"
members = [
  "crates/specter",
  "apps/todo-cli",
  "apps/wallet-cli",
  "apps/deploy-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/devagrawal09/specter"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
specter = { path = "crates/specter" }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
