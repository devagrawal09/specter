name: Runtime protocol conformance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @specter-ts/core --filter @specter-ts/protocol --filter @specter-ts/observability build
      - run: pnpm --filter @specter-ts/protocol --filter @specter-ts/observability test
      - run: go test ./...
        working-directory: runtimes/go
      - run: pnpm --filter @specter/reference build
      - name: Cross-runtime HTTP/SSE interoperability
        shell: bash
        run: |
          node packages/observability/dist/cli.js serve --database /tmp/specter-observability >/tmp/specter-collector.log 2>&1 &
          collector_pid=$!
          pnpm --filter @specter/reference start >/tmp/specter-typescript.log 2>&1 &
          typescript_pid=$!
          (cd runtimes/go && go run ./cmd/todo) >/tmp/specter-go.log 2>&1 &
          go_pid=$!
          trap 'kill "$collector_pid" "$typescript_pid" "$go_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:41731/specter/v1/capabilities http://127.0.0.1:41736/specter/v1/capabilities http://127.0.0.1:41737/specter/v1/capabilities; do
            for attempt in {1..60}; do
              curl --fail --silent "$url" >/dev/null && break
              if [ "$attempt" = 60 ]; then
                cat /tmp/specter-collector.log /tmp/specter-typescript.log /tmp/specter-go.log
                exit 1
              fi
              sleep 1
            done
          done
          SPECTER_GO_PROTOCOL_URL=http://127.0.0.1:41737/specter/v1 pnpm --filter @specter-ts/protocol test
          (cd runtimes/go && SPECTER_TYPESCRIPT_PROTOCOL_URL=http://127.0.0.1:41731/specter/v1 go test ./...)
          for attempt in {1..30}; do
            node packages/observability/dist/cli.js snapshot > /tmp/specter-snapshot.json
            node -e "const value=require('/tmp/specter-snapshot.json');const apps=new Set(value.sources.map(x=>x.source.application));process.exit(apps.has('todo-reference')&&apps.has('go-todo-reference')?0:1)" && break
            if [ "$attempt" = 30 ]; then
              cat /tmp/specter-snapshot.json /tmp/specter-collector.log
              exit 1
            fi
            sleep 1
          done
