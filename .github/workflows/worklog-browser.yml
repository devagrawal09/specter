name: Worklog browser

on:
  pull_request:
    paths:
      - '.github/workflows/worklog-browser.yml'
      - 'apps/worklog/**'
      - 'packages/core/**'
      - 'packages/memory/**'
      - 'packages/sqlite/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/worklog-browser.yml'
      - 'apps/worklog/**'
      - 'packages/core/**'
      - 'packages/memory/**'
      - 'packages/sqlite/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter @specter-ts/core --filter @specter-ts/memory --filter @specter-ts/sqlite build
      - run: pnpm --filter @specter/worklog exec playwright install --with-deps chromium
      - run: pnpm --filter @specter/worklog test:e2e
