name: Postgres integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: specter
          POSTGRES_PASSWORD: specter
          POSTGRES_DB: specter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specter -d specter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPECTER_POSTGRES_URL: postgresql://specter:specter@127.0.0.1:5432/specter_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter @specter-ts/core --filter @specter-ts/reaction-outbox --filter @specter-ts/postgres build
      - run: pnpm --filter @specter-ts/postgres test
