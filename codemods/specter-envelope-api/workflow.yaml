# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

params:
  schema:
    command_names:
      name: Command Slice names
      description: Comma-separated flat operation names that must become command envelopes
      type: string
      default: ""
    query_names:
      name: Query Slice names
      description: Comma-separated flat operation names that must become query and subscription envelopes
      type: string
      default: ""
    receiver_names:
      name: App and transport bindings
      description: Comma-separated local bindings on which flat Specter operations are called
      type: string
      default: "app,specterClient,specterTransport"
    transport_module:
      name: Browser transport module
      description: Project-relative module exporting createSpecterBrowserTransport
      type: string
      default: "./transport/specter-browser"

nodes:
  - id: migrate-specter-envelope-api
    name: Migrate flat Specter calls to typed envelopes
    type: automatic
    steps:
      - name: Rewrite typed app and project-owned transport calls
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.ts"
            - "**/*.tsx"
          exclude:
            - "**/codemods/**"
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/*.d.ts"
