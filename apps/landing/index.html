<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specter — “Compile” JSON specs into complete applications</title>
    <meta
      name="description"
      content="Specter surrounds agent-written Slice implementations with portable JSON specifications, deterministic scenario tests, and a starter application runtime."
    />
    <meta name="theme-color" content="#0a0d11" />
    <script>
      ;(() => {
        const storageKey = 'specter-theme'
        let theme

        try {
          const storedTheme = localStorage.getItem(storageKey)
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme
          }
        } catch {}

        theme ??= matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'light' ? '#f5f7f3' : '#0a0d11')
      })()
    </script>
